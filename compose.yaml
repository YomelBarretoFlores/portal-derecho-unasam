# Portal Derecho y Ciencias Políticas — UNASAM
#
# Despliegue en un servidor propio. Para Render se usa render.yaml.
#
#   1. Crear «portal.env» junto a este archivo, con las variables de entorno
#      de la APLICACIÓN. Contiene contraseñas: chmod 600. Ignorado por git.
#
#      Opcionalmente, un «.env» junto a este archivo para ajustar el
#      DESPLIEGUE (dónde se publica el puerto). Son cosas distintas:
#      portal.env entra en el contenedor, .env lo lee Docker Compose.
#   2. docker compose up -d --build
#   3. docker compose logs -f   ← el arranque explica qué hizo y qué faltó
#
# Las actualizaciones posteriores las aplica docker/actualizar.sh.
# Detalle de cada variable: DEPLOY.md.

services:
  portal:
    build: .
    env_file: portal.env
    restart: unless-stopped

    # El contenedor sirve HTTP plano; el certificado lo pone el proxy de la
    # institución. Por eso se publica solo en la interfaz local: así nadie
    # puede saltarse ese proxy y llegar al sitio sin cifrar.
    #
    # Si NO hay proxy delante y el contenedor debe atender directamente desde
    # la red, cree un archivo «.env» junto a este y ponga:
    #
    #     PORTAL_BIND=0.0.0.0
    #     PORTAL_PUERTO=8080
    #
    # NO edite este archivo para cambiarlo. docker/actualizar.sh sincroniza el
    # repositorio con «git reset --hard», así que cualquier cambio hecho aquí
    # se perdería en la siguiente actualización y el sitio dejaría de responder
    # sin motivo aparente. El archivo «.env» está fuera del control de versiones
    # justamente para eso.
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PUERTO:-8080}:8080"

    # Sin este volumen, todo lo que se suba desde el panel —portadas, PDF,
    # retratos— desaparece en la siguiente actualización. Es también el motivo
    # por el que MEDIA_UPLOADS_ENABLED viene en false: más vale no admitir
    # cargas que perderlas en silencio.
    volumes:
      - portal-storage:/app/storage

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      # El primer arranque migra la base de datos y siembra el contenido, así
      # que tarda más que los siguientes. Sin este margen, Docker daría el
      # contenedor por enfermo mientras todavía está haciendo su trabajo.
      start_period: 90s
      retries: 3

volumes:
  portal-storage:
